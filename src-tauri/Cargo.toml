[package]
name = "tauri-test"
version = "0.0.0"
description = "tauri-description"
authors = ["Mr.Li"]
edition = "2021"

[lib]
name = "tauri_test_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
sysinfo = "0.30"

[features]
custom-protocol = ["tauri/custom-protocol"]
